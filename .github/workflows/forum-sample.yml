# Temporary: runs the app's own src/api.js against the live forum to check
# images and attachments in real threads. Remove once done.
name: Forum check

on:
  push:
    branches: [claude/admiring-archimedes-675hd0]
    paths: [.github/workflows/forum-sample.yml, scripts/check-forum/**]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read real threads with the app's code
        run: THREADS=22815,21047,23024,23028 node scripts/check-forum/check.mjs
