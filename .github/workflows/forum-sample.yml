# Temporary: what the bare app folder address returns. Remove once done.
name: Site check

on:
  push:
    branches: [claude/admiring-archimedes-675hd0]
    paths: [.github/workflows/forum-sample.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bare app folder
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for u in https://www.al-amen.com/app/ https://www.al-amen.com/app https://al-amen.com/app/ http://www.al-amen.com/app/index.html; do
            curl -sS -o /dev/null -A "$UA" -w "%{http_code} -> %{redirect_url}  type=%{content_type}  $u\n" "$u"
          done
          curl -sS -I -A "$UA" https://www.al-amen.com/app/ | head -12
          echo "== root .htaccess rules that could catch /app/"
          curl -sS -o /dev/null -w "%{http_code} root index\n" https://www.al-amen.com/
