# Temporary: prints how images and attachments appear in the forum's pages,
# to fix their preview in the app. Remove once done.
name: Forum markup sample

on:
  push:
    branches: [claude/admiring-archimedes-675hd0]
    paths: [.github/workflows/forum-sample.yml]

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent threads and show image and attachment markup
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148"
          F=https://www.al-amen.com/vb
          curl -sS -A "$UA" "$F/external.php?type=RSS2" | iconv -f WINDOWS-1256 -t UTF-8 > rss.xml || true
          ids=$(grep -oE 'showthread\.php\?t=[0-9]+' rss.xml | grep -oE '[0-9]+' | sort -u | head -15)
          echo "threads: $ids"
          for t in $ids; do
            curl -sS -A "$UA" "$F/printthread.php?t=$t&pp=40&styleid=108" | iconv -f WINDOWS-1256 -t UTF-8 > p$t.html || true
            curl -sS -A "$UA" "$F/showthread.php?t=$t&styleid=108" | iconv -f WINDOWS-1256 -t UTF-8 > s$t.html || true
            n=$(grep -coiE '<img|attachment' p$t.html || true)
            echo "===== thread $t  print-matches=$n"
            # Markup around images and attachments inside posts (not the page chrome).
            sed -n '/<li class="postbit/,$p' p$t.html | grep -oiE '<(img|a)[^>]*(attach|\.jpe?g|\.png|\.gif|\.webp|\.pdf|\.mp3|\.zip|\.rar|\.docx?)[^>]*>[^<]{0,80}' | head -12
            echo "----- showthread"
            grep -oiE '<(img|a)[^>]*attachment[^>]*>[^<]{0,80}|<div class="attachments"|<fieldset class="postcontent"|class="attachments[^"]*"' s$t.html | head -12
          done
          echo "===== attachment fetch as guest"
          a=$(grep -ohE 'attachment\.php\?attachmentid=[0-9]+[^"]*' s*.html p*.html | head -1 | sed 's/&amp;/\&/g')
          [ -n "$a" ] && curl -sS -o /dev/null -A "$UA" -w "status=%{http_code} type=%{content_type} size=%{size_download} redirect=%{redirect_url}\n" "$F/$a"
          [ -n "$a" ] && curl -sS -o /dev/null -A "$UA" -e "https://fyodorii.github.io/" -w "with github referer: status=%{http_code} type=%{content_type} size=%{size_download}\n" "$F/$a"
